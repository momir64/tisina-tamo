<!doctype html>
<html lang="sr-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tišina tamo</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="title">
    <h1>Tišina tamo</h1>
  </div>
  <button id="theme" class="icon-btn" title="Tamna / svetla tema" aria-label="Tamna / svetla tema">
    <svg id="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    <svg id="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" hidden><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM2 13h2a1 1 0 1 0 0-2H2a1 1 0 1 0 0 2zm18 0h2a1 1 0 1 0 0-2h-2a1 1 0 1 0 0 2zM11 2v2a1 1 0 1 0 2 0V2a1 1 0 1 0-2 0zm0 18v2a1 1 0 1 0 2 0v-2a1 1 0 1 0-2 0zM5.99 4.58a1 1 0 1 0-1.41 1.41l1.06 1.06a1 1 0 1 0 1.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 1 0-1.41 1.41l1.06 1.06a1 1 0 1 0 1.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 1 0-1.41-1.41l-1.06 1.06a1 1 0 1 0 1.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 1 0-1.41-1.41l-1.06 1.06a1 1 0 1 0 1.41 1.41l1.06-1.06z"/></svg>
  </button>
  <label class="switch" title="Uključeno">
    <input type="checkbox" id="enabled"><span></span>
  </label>
</header>

<main>
  <section class="card">
    <div class="field">
      <input type="text" id="wordInput" placeholder="Upiši frazu i pritisni Enter" spellcheck="false" autocomplete="off">
      <label for="wordInput">Utišaj kada je vidljivo</label>
      <button type="button" id="addWord" class="add-btn" title="Dodaj frazu" aria-label="Dodaj frazu"></button>
    </div>
    <div class="chip-list" id="chips"></div>

    <label class="row">
      <span>Razlikuj velika i mala slova</span>
      <span class="switch"><input type="checkbox" id="caseSensitive"><span></span></span>
    </label>

    <label class="row">
      <span>Zamuti sliku dok je zvuk utišan</span>
      <span class="switch"><input type="checkbox" id="blurVideo"><span></span></span>
    </label>
  </section>

  <section class="card">
    <h2>Oblast skeniranja</h2>
    <div class="grid4">
      <div class="field"><input type="text" inputmode="numeric" autocomplete="off" class="num" maxlength="3" id="rx"><span class="unit">%</span><label for="rx">Levo</label></div>
      <div class="field"><input type="text" inputmode="numeric" autocomplete="off" class="num" maxlength="3" id="ry"><span class="unit">%</span><label for="ry">Gore</label></div>
      <div class="field"><input type="text" inputmode="numeric" autocomplete="off" class="num" maxlength="3" id="rw"><span class="unit">%</span><label for="rw">Širina</label></div>
      <div class="field"><input type="text" inputmode="numeric" autocomplete="off" class="num" maxlength="3" id="rh"><span class="unit">%</span><label for="rh">Visina</label></div>
    </div>
  </section>

  <section class="card">
    <h2>Detekcija</h2>
    <div class="grid2">
      <div class="field"><input type="text" inputmode="numeric" autocomplete="off" class="num" maxlength="5" id="intervalMs"><span class="unit">ms</span><label for="intervalMs">Interval skeniranja</label></div>
      <div class="field"><input type="text" inputmode="numeric" autocomplete="off" class="num" maxlength="2" id="holdScans"><label for="holdScans">Uzastopnih skeniranja</label></div>
    </div>
    <div class="grid2">
      <div class="field"><input type="text" inputmode="numeric" autocomplete="off" class="num" maxlength="3" id="whitePercent"><span class="unit">%</span><label for="whitePercent">Osetljivost na bela slova</label></div>
      <div class="field"><input type="text" inputmode="numeric" autocomplete="off" class="num" maxlength="2" id="hammingTolerance"><span class="unit">slova</span><label for="hammingTolerance">Tolerancija grešaka</label></div>
    </div>

    <label class="row">
      <span>Dijagnostički prikaz</span>
      <span class="switch"><input type="checkbox" id="debug"><span></span></span>
    </label>
  </section>
</main>

<footer>
  <button id="reset" class="text-btn">Vrati podrazumevana podešavanja</button>
  <span id="status" aria-live="polite"></span>
</footer>
<script src="popup.js"></script>
</body>
</html>
